apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis-fib
        image: redis:8-alpine
        ports:
        - containerPort: 6379
        securityContext:
          runAsNonRoot: true
          runAsUser: 999         # "redis" user from the redis:8-alpine image
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 200m
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data       # redis WORKDIR, needs to be writable for RDB snapshots
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379