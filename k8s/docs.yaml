apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-deployment
  labels:
    app: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
      - name: fibonacci-docs
        image: fibonacci-docs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: docs-service
spec:
  type: NodePort
  selector:
    app: docs
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30180