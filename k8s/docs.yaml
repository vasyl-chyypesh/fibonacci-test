apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-deployment
  annotations:
    ignore-check.kube-linter.io/latest-tag: "image is built directly into the minikube docker daemon, imagePullPolicy is Never"
  labels:
    app: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
      - name: fibonacci-docs
        image: fibonacci-docs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000        # "node" user from the node:25-alpine image
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: HOME             # "npx --yes http-server" caches under $HOME at startup
          value: /home/node
        volumeMounts:
        - name: home
          mountPath: /home/node
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: home
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-service
spec:
  type: NodePort
  selector:
    app: docs
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30180