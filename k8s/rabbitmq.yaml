apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq-fib
        image: rabbitmq:4-alpine
        ports:
        - containerPort: 5672
        securityContext:
          runAsNonRoot: true
          runAsUser: 100         # "rabbitmq" user from the rabbitmq:4-alpine image
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 200m
          limits:
            memory: 1Gi
        # do NOT mount over /etc/rabbitmq: the image ships conf.d/10-defaults.conf there,
        # which sets "loopback_users.guest = false" and "log.console = true"
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq   # mnesia database and .erlang.cookie
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672