apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  annotations:
    ignore-check.kube-linter.io/latest-tag: "image is built directly into the minikube docker daemon, imagePullPolicy is Never"
    ignore-check.kube-linter.io/no-liveness-probe: "the worker exposes no HTTP surface; it exits non-zero when it cannot attach to the queue, so restartPolicy covers the failure path"
    ignore-check.kube-linter.io/no-readiness-probe: "the worker serves no traffic and backs no Service, so readiness has nothing to gate"
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      # pod-level defaults so anything added to this pod later inherits them;
      # the container below still sets its own for the container-only fields
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fibonacci-worker
        image: fibonacci-worker:latest
        command: ["node", "dist/worker/index.js"]
        imagePullPolicy: Never
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000        # "node" user from the node:25-alpine image
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: redis-url
        - name: RABBIT_URL
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: rabbitmq-url
# no need to have a service for the worker, because it works with rabbitmq and redis directly